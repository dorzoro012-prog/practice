# Docker Nagios lab (the image shown is a third-party community image; image behavior varies)
docker pull jasonrivers/nagios:latest
docker run -d --name se-nagios -p 8085:80 jasonrivers/nagios:latest
docker ps
docker logs --tail 80 se-nagios
# Browser: http://localhost:8085/nagios/ (verify actual image documentation/login)
# For monitoring a target, Nagios inside a container needs a route to that host.
# Example Nagios Core configuration fragment: file /opt/nagios/etc/objects/se-host.cfg
# (Actual config directory differs by image; check container before editing.)
define host {
  use                     generic-host
  host_name               se-app-host
  address                 TARGET_IP_OR_DNS
  check_command           check-host-alive
}
define service {
  use                     generic-service
  host_name               se-app-host
  service_description     HTTP
  check_command           check_http!-p 8080
}
# Additional checks: check_ping, check_tcp!3306; CPU/memory/disk require NRPE/NCPA
# or agent/exporter configured on monitored host; the basic container alone cannot
# magically read a remote host's CPU/memory/disk.
# Validate with the Nagios binary (path varies): nagios -v /PATH/TO/nagios.cfg
# Restart/reload Nagios after config validation (image-specific).
# WARNING and CRITICAL thresholds are plugin-specific, e.g. check_http -w 2 -c 5.
# Alert demonstration: stop app, wait until checks run, inspect Service Status,
# then restart app and wait until recovery check occurs. Do not disable Nagios to test app.
# If port 8085 is occupied, map another unused HOST port to container port 80.
